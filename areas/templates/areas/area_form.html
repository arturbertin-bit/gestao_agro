{% extends "base.html" %}

{% block content %}

<div class="form-page">

    <div class="form-header">
        <div>
            <p class="page-subtitle">GESTÃO AGRÍCOLA</p>
            <h1>Cadastrar área</h1>
            <p class="page-description">
                Adicione uma nova área à propriedade.
            </p>
        </div>

        <a href="{% url 'areas:areas_list' %}" class="btn-secondary">
            ← Voltar
        </a>
    </div>


    <div class="form-card">

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}


        <form action="" method="post">

            {% csrf_token %}

            <div class="form-group">
                <label for="nome">Nome da área</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Ex: Área Norte"
                    required
                >

                <small>
                    Dê um nome para identificar facilmente esta área.
                </small>
            </div>


            <div class="form-group">
                <label for="tamanho">Tamanho</label>

                <div class="input-with-unit">
                    <input
                        type="number"
                        id="tamanho"
                        name="tamanho"
                        placeholder="Ex: 15"
                        min="0"
                        step="0.01"
                        required
                    >

                    <span>ha</span>
                </div>

                <small>
                    Informe o tamanho da área em hectares.
                </small>
            </div>


            <div class="form-actions">

                <a href="{% url 'areas:areas_list' %}" class="btn-secondary">
                    Cancelar
                </a>

                <button type="submit" class="btn-primary">
                    Cadastrar área
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
